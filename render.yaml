services:
  - type: web
    name: schools-ke-platform
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_SITE_URL
        value: https://schools.co.ke
      - key: SIGNATURE_QR_URL
        value: https://schools.co.ke
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: schools-data
      mountPath: /var/data
      sizeGB: 1
