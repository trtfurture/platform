<section class="cookie-banner" id="cookie-banner" aria-label="Cookie preferences" hidden>
  <div class="cookie-banner-copy"><span class="eyebrow">YOUR PRIVACY, YOUR CHOICE</span><strong>Choose how this site uses cookies</strong><p>Essential cookies keep the site and secure administration working. Optional analytics help us understand which public pages are useful. Analytics are off unless you allow them.</p></div>
  <div class="cookie-banner-actions"><button type="button" class="button button-outline" data-cookie-essential>Essential only</button><button type="button" class="button button-dark" data-cookie-all>Accept all</button><button type="button" class="cookie-customize-link" data-cookie-customize>Customize</button></div>
  <div class="cookie-custom-panel" id="cookie-custom-panel" hidden>
    <div class="cookie-choice-row"><div><strong>Essential cookies</strong><small>Required for core site and admin security.</small></div><input type="checkbox" checked disabled aria-label="Essential cookies are always active"></div>
    <label class="cookie-choice-row"><span><strong>Site analytics</strong><small>Anonymous page-visit counts and popular pages.</small></span><input type="checkbox" id="cookie-analytics"></label>
    <div class="cookie-banner-actions"><button type="button" class="button button-dark" data-cookie-save>Save my choices</button><button type="button" class="cookie-customize-link" data-cookie-cancel>Cancel</button></div>
  </div>
</section>
<button class="cookie-settings-tab" type="button" data-open-cookie-settings aria-label="Open cookie settings">Cookie settings</button>
